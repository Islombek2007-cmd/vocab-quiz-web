<!DOCTYPE html>
<html>
<head>
    <title>Create Final Test</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .word-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f8fafc;
            border-radius: 20px;
        }
        .word-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .word-option.selected {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: #6366f1;
        }
        .word-option.selected .word-text,
        .word-option.selected .translation-text {
            color: white;
        }
        .word-option input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .word-text {
            font-weight: 700;
            color: #1e293b;
        }
        .translation-text {
            font-size: 12px;
            color: #64748b;
        }
        .selected-count {
            background: #6366f1;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div><a href="/home" class="home-link-nav">← Back</a> | <a href="/logout">Logout</a></div>
        </nav>
        
        <div class="dashboard-content">
            <div class="page-header">
                <h1>📝 Create Final Test</h1>
                <p>Select 20 words for your test</p>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label>Test Name</label>
                    <input type="text" id="testName" placeholder="e.g., Week 1 Final Test" style="width: 100%; padding: 12px;">
                </div>
                
                <div class="selected-count" id="selectedCount">0 words selected (need 20)</div>
                
                <div class="word-selector" id="wordSelector">
                    {% for word in vocabulary %}
                    <div class="word-option" data-id="{{ word[0] }}" data-word="{{ word[1] }}" data-translation="{{ word[2] }}" onclick="toggleSelect(this)">
                        <input type="checkbox">
                        <div>
                            <div class="word-text">{{ word[1] }}</div>
                            <div class="translation-text">{{ word[2] }}</div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                
                <button onclick="createTest()" class="btn-primary" style="margin-top: 20px;">✅ Create Test</button>
                <div id="message" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>
    
    <script>
        let selectedWords = [];
        
        function toggleSelect(element) {
            let id = element.dataset.id;
            let word = element.dataset.word;
            let translation = element.dataset.translation;
            let checkbox = element.querySelector('input');
            
            if (selectedWords.includes(id)) {
                selectedWords = selectedWords.filter(w => w !== id);
                element.classList.remove('selected');
                checkbox.checked = false;
            } else {
                if (selectedWords.length >= 20) {
                    document.getElementById('message').innerHTML = '<div class="error-msg">❌ You can only select 20 words!</div>';
                    return;
                }
                selectedWords.push(id);
                element.classList.add('selected');
                checkbox.checked = true;
            }
            
            document.getElementById('selectedCount').innerHTML = selectedWords.length + ' words selected (need 20)';
            document.getElementById('message').innerHTML = '';
        }
        
        function createTest() {
            let testName = document.getElementById('testName').value;
            
            if (!testName) {
                document.getElementById('message').innerHTML = '<div class="error-msg">❌ Please enter a test name</div>';
                return;
            }
            
            if (selectedWords.length !== 20) {
                document.getElementById('message').innerHTML = '<div class="error-msg">❌ Please select exactly 20 words (currently ' + selectedWords.length + ')</div>';
                return;
            }
            
            fetch('/create_test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: testName,
                    word_ids: selectedWords
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('message').innerHTML = '<div class="success-msg">✅ Test created successfully! <a href="/home">Go to Dashboard</a></div>';
                } else {
                    document.getElementById('message').innerHTML = '<div class="error-msg">❌ Error: ' + data.error + '</div>';
                }
            });
        }
    </script>
</body>
</html>
