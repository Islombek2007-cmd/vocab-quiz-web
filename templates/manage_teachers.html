<!DOCTYPE html>
<html>
<head>
    <title>Manage Teachers - VocabQuiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div class="nav-user">
                <a href="/home" class="home-link-nav">← Dashboard</a>
                <a href="/logout" class="logout-btn">🚪 Logout</a>
            </div>
        </nav>
        
        <div class="dashboard-content">
            <div class="page-header">
                <h1>👩‍🏫 Manage Teachers</h1>
                <p>Add or remove teachers in the system</p>
            </div>
            
            <div class="form-card">
                <h2>➕ Add New Teacher</h2>
                <form method="POST" action="/add_teacher">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="Enter username" required>
                        </div>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="full_name" placeholder="Enter full name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">➕ Add Teacher</button>
                </form>
            </div>
            
            <div class="data-table">
                <h2>📋 Existing Teachers</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Full Name</th>
                                <th>Username</th>
                                <th>Students</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for teacher in teachers %}
                            <tr>
                                <td><strong>{{ teacher[2] }}</strong></td>
                                <td>@{{ teacher[1] }}</td>
                                <td>
                                    <a href="/manage_students/{{ teacher[0] }}" class="btn-secondary">👨‍🎓 View Students</a>
                                </td>
                                <td>
                                    <a href="/delete_teacher/{{ teacher[0] }}" class="btn-delete" onclick="return confirm('Delete this teacher?')">🗑️ Delete</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
