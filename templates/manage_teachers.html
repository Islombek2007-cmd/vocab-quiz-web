<!DOCTYPE html>
<html>
<head>
    <title>Manage Teachers</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div><a href="/home" class="home-link-nav">← Back</a> | <a href="/logout">Logout</a></div>
        </nav>
        <div class="dashboard-content">
            <h1>Manage Teachers</h1>
            <form method="POST" action="/add_teacher">
                <input type="text" name="username" placeholder="Username" required>
                <input type="text" name="full_name" placeholder="Full Name" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Add Teacher</button>
            </form>
            <h2>Existing Teachers</h2>
            <ul>
                {% for teacher in teachers %}
                <li>{{ teacher[2] }} (@{{ teacher[1] }}) 
                    <a href="/manage_students/{{ teacher[0] }}">👨‍🎓 View Students</a>
                    <a href="/delete_teacher/{{ teacher[0] }}" onclick="return confirm('Delete?')">Delete</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
