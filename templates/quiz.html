<!DOCTYPE html>
<html>
<head>
    <title>Quiz - VocabQuiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div><a href="/home" class="home-link-nav">← Back</a> | <a href="/logout">Logout</a></div>
        </nav>
        <div class="dashboard-content">
            
            <!-- Level Selector -->
            <div class="level-selector">
                <label>📊 Select Difficulty Level:</label>
                <select id="levelSelect" onchange="changeLevel()">
                    <option value="easy" {% if selected_level == 'easy' %}selected{% endif %}>🟢 Easy</option>
                    <option value="medium" {% if selected_level == 'medium' %}selected{% endif %}>🟡 Medium</option>
                    <option value="hard" {% if selected_level == 'hard' %}selected{% endif %}>🔴 Hard</option>
                </select>
            </div>

            <script>
                function changeLevel() {
                    var level = document.getElementById('levelSelect').value;
                    window.location.href = '/take_quiz?level=' + level;
                }
            </script>

            {% if question %}
            <div class="quiz-card">
                <h2>Translate this word:</h2>
                <div class="big-word">{{ question }}</div>
                <form method="POST">
                    <input type="text" name="answer" placeholder="Type your answer" autofocus required>
                    <input type="hidden" name="word_id" value="{{ word_id }}">
                    <input type="hidden" name="correct_answer" value="{{ correct_answer }}">
                    <input type="hidden" name="level" value="{{ selected_level }}">
                    <button type="submit">Check Answer</button>
                </form>
            </div>
            {% else %}
            <div class="no-words">
                <p>📚 No vocabulary available at this level.</p>
                <p>Ask your teacher to add words for <strong>{{ selected_level }}</strong> level.</p>
                <a href="/take_quiz?level=easy" class="next-btn">Try Easy Level</a>
            </div>
            {% endif %}
            
            {% if result %}
            <div class="result-box">{{ result }}</div>
            <a href="/take_quiz?level={{ selected_level }}" class="next-btn">Next Question →</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
