<!DOCTYPE html>
<html>
<head>
    <title>Owner Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Owner Panel</h1>
        <h2>Add Admin</h2>
        <form method="POST" action="/add_admin">
            <input type="text" name="name" placeholder="Admin Name (e.g., 55 Center)" required>
            <input type="text" name="telegram_id" placeholder="Admin Telegram ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Add Admin</button>
        </form>
        <hr>
        <h2>Existing Admins</h2>
        <ul>
            {% for admin in admins %}
            <li>
                {{ admin[1] }} (ID: {{ admin[2] }})
                <a href="/delete_admin/{{ admin[0] }}" class="delete" onclick="return confirm('Delete this admin?')">Delete</a>
            </li>
            {% endfor %}
        </ul>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
