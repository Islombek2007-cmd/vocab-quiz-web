<!DOCTYPE html>
<html>
<head>
    <title>All Stats - VocabQuiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div><a href="/home" class="home-link-nav">← Back</a> | <a href="/logout">Logout</a></div>
        </nav>
        <div class="dashboard-content">
            <h1>Global Statistics</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👑</div>
                    <div><h3>1</h3><p>Owner</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📋</div>
                    <div><h3 id="adminCount">0</h3><p>Admins</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👩‍🏫</div>
                    <div><h3 id="teacherCount">0</h3><p>Teachers</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎓</div>
                    <div><h3 id="studentCount">0</h3><p>Students</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div><h3 id="wordCount">0</h3><p>Vocabulary Words</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div><h3 id="quizCount">0</h3><p>Total Quizzes</p></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        fetch('/api/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('adminCount').innerText = data.admins;
                document.getElementById('teacherCount').innerText = data.teachers;
                document.getElementById('studentCount').innerText = data.students;
                document.getElementById('wordCount').innerText = data.words;
                document.getElementById('quizCount').innerText = data.quizzes;
            });
    </script>
</body>
</html>
