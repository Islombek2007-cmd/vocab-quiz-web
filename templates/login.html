<!DOCTYPE html>
<html>
<head>
    <title>Login - VocabQuiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="logo">📚</div>
            <h1>VocabQuiz</h1>
            <p>Learn languages effortlessly</p>
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            
            <div class="login-tabs">
                <button class="tab-btn active" onclick="showTab('code')">🔑 Login with Code</button>
                <button class="tab-btn" onclick="showTab('password')">👤 Staff Login</button>
            </div>
            
            <!-- Student Code Login -->
            <div id="codeTab" class="tab-content active">
                <form method="POST" action="/login_code">
                    <div class="input-group">
                        <label>Your Login Code</label>
                        <input type="text" name="login_code" placeholder="Paste your code here" required autofocus>
                    </div>
                    <button type="submit">Login →</button>
                </form>
                <div class="login-footer">
                    <small>Ask your teacher for your personal code</small>
                </div>
            </div>
            
            <!-- Staff Login (Owner/Admin/Teacher) -->
            <div id="passwordTab" class="tab-content" style="display:none;">
                <form method="POST" action="/login_staff">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" name="username" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit">Login →</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        function showTab(tab) {
            document.getElementById('codeTab').style.display = tab === 'code' ? 'block' : 'none';
            document.getElementById('passwordTab').style.display = tab === 'password' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
