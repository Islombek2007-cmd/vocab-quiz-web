<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Admin Panel - {{ admin_name }}</h1>
        <h2>Add Teacher</h2>
        <form method="POST" action="/add_teacher">
            <input type="text" name="username" placeholder="Teacher Username" required>
            <input type="text" name="telegram_id" placeholder="Teacher Telegram ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Add Teacher</button>
        </form>
        <hr>
        <h2>Existing Teachers</h2>
        <ul>
            {% for teacher in teachers %}
            <li>
                {{ teacher[1] }} (ID: {{ teacher[2] }})
                <a href="/delete_teacher/{{ teacher[0] }}" class="delete" onclick="return confirm('Delete this teacher?')">Delete</a>
            </li>
            {% endfor %}
        </ul>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
