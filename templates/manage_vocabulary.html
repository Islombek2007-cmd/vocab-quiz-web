<!DOCTYPE html>
<html>
<head>
    <title>My Vocabulary - VocabQuiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div class="nav-user">
                <a href="/home" class="home-link-nav">← Dashboard</a>
                <a href="/logout" class="logout-btn">🚪 Logout</a>
            </div>
        </nav>
        
        <div class="dashboard-content">
            <div class="page-header">
                <h1>📚 My Vocabulary</h1>
                <p>Manage your word collection by level</p>
            </div>
            
            <div class="two-columns">
                <!-- Single Word Add -->
                <div class="form-card">
                    <h2>➕ Add Single Word</h2>
                    <form method="POST" action="/add_vocab">
                        <div class="form-group">
                            <label>Word</label>
                            <input type="text" name="word" placeholder="e.g., Apple" required>
                        </div>
                        <div class="form-group">
                            <label>Translation</label>
                            <input type="text" name="translation" placeholder="e.g., Olma" required>
                        </div>
                        <div class="form-group">
                            <label>Level</label>
                            <select name="level">
                                <option value="easy">🟢 Easy</option>
                                <option value="medium">🟡 Medium</option>
                                <option value="hard">🔴 Hard</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">➕ Add Word</button>
                    </form>
                </div>
                
                <!-- Bulk Import -->
                <div class="form-card">
                    <h2>📦 Bulk Import</h2>
                    <div class="form-group">
                        <label>Words (one per line: word = translation)</label>
                        <textarea id="bulkWords" rows="8" placeholder="apple = olma&#10;banana = banan&#10;car = mashina"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Level for all</label>
                        <select id="bulkLevel">
                            <option value="easy">🟢 Easy</option>
                            <option value="medium">🟡 Medium</option>
                            <option value="hard">🔴 Hard</option>
                        </select>
                    </div>
                    <button onclick="bulkAdd()" class="btn-primary">📦 Add All Words</button>
                    <div id="bulkResult"></div>
                </div>
            </div>
            
            <!-- Word List -->
            <div class="data-table">
                <h2>📋 Word List ({{ vocabulary|length }} words)</h2>
                <div class="word-grid">
                    {% for vocab in vocabulary %}
                    <div class="word-card">
                        <div class="word">{{ vocab[1] }}</div>
                        <div class="translation">→ {{ vocab[2] }}</div>
                        {% if vocab[3] %}
                        <div class="word-level level-{{ vocab[3] }}">{{ vocab[3] }}</div>
                        {% endif %}
                        <a href="/delete_vocab/{{ vocab[0] }}" class="btn-delete-small" onclick="return confirm('Delete?')">🗑️</a>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function bulkAdd() {
            let text = document.getElementById('bulkWords').value;
            let level = document.getElementById('bulkLevel').value;
            fetch('/bulk_add_vocab', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({words: text, level: level})
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
