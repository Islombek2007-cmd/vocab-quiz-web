<!DOCTYPE html>
<html>
<head>
    <title>My Vocabulary</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-brand"><h2>📖 VocabQuiz</h2></div>
            <div><a href="/home" class="home-link-nav">← Back</a> | <a href="/logout">Logout</a></div>
        </nav>
        <div class="dashboard-content">
            <h1>My Vocabulary</h1>
            <form method="POST" action="/add_vocab">
                <input type="text" name="word" placeholder="Word (e.g., Apple)" required>
                <input type="text" name="translation" placeholder="Translation (e.g., Olma)" required>
                <button type="submit">Add Word</button>
            </form>
            <ul>
                {% for vocab in vocabulary %}
                <li>{{ vocab[1] }} = {{ vocab[2] }} <a href="/delete_vocab/{{ vocab[0] }}" onclick="return confirm('Delete?')">Delete</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
